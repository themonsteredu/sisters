<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:900px;background:#d9d2c3;display:grid;place-items:center;font-family:"Pretendard"}
.pg{width:1080px;height:800px;background:#fffdf6;transform:rotate(-2deg);box-shadow:0 20px 50px rgba(0,0,0,.25);padding:60px 80px;background-image:repeating-linear-gradient(#fffdf6 0 47px,#c9dbf0 47px 48px);position:relative}

p{font-size:30px;line-height:48px;margin:0;color:#233;font-weight:500}
.hl{background:linear-gradient(transparent 55%,#ffe98a 55%)}
.box{position:absolute;right:90px;top:260px;border:3px solid #6d5ce8;border-radius:16px;padding:14px 22px;font-size:28px;color:#6d5ce8;font-weight:700;transform:rotate(3deg)}

<h1>광합성 핵심 개념 정리</h1>
<p>1. 광합성: 빛에너지로 <span class="hl">양분(포도당)</span>을 만드는 과정</p>
<p>2. 장소: 잎의 세포 속 <span class="hl">엽록체</span></p>
<p>3. 재료: 이산화 탄소 + 물</p>
<p>4. 결과: 포도당 + 산소</p>
<p>&nbsp;&nbsp;&nbsp;이산화 탄소 + 물 → 포도당 + 산소</p>
<p>5. 영향 요인: 빛의 세기, 온도, CO₂ 농도</p>
<p>&nbsp;</p><p>※ 헷갈린 것: 호흡과 광합성 비교 → 다시 보기!</p>

</div></body></html>
